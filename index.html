<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Weather Fit</title>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <div id="weather-background" aria-hidden="true">
    <div class="sky"></div>
    <div class="scene" data-scene="sunny">
      <div class="sun"></div>
    </div>
    <div class="scene" data-scene="partly-cloudy">
      <div class="sun small"></div>
      <div class="cloud c1"></div>
      <div class="cloud c2"></div>
    </div>
    <div class="scene" data-scene="cloudy">
      <div class="cloud c1"></div>
      <div class="cloud c2"></div>
      <div class="cloud c3"></div>
      <div class="cloud c4"></div>
    </div>
    <div class="scene" data-scene="rain">
      <div class="cloud c1"></div>
      <div class="cloud c2"></div>
      <div class="rain-layer"></div>
    </div>
    <div class="scene" data-scene="snow">
      <div class="cloud c1"></div>
      <div class="snow-layer"></div>
    </div>
  </div>
  <div id="app">
    <header id="main-header">
      <button id="location-toggle" class="header-field" aria-expanded="false" aria-controls="controls-panel">
        <span class="header-label">Location</span>
        <span id="location-name">Set your location</span>
      </button>
      <button id="date-toggle" class="header-field" aria-expanded="false" aria-controls="controls-panel">
        <span class="header-label">Date</span>
        <span id="date-name">-</span>
      </button>
      <button id="info-button" aria-label="Information">ⓘ</button>
    </header>

    <section id="controls-panel" hidden>
      <div id="location-controls">
        <label for="manual-location-input">City or ZIP code</label>
        <div id="location-input-row">
          <input id="manual-location-input" type="text" placeholder="e.g. Austin, TX or 78701">
          <button id="manual-location-submit" type="button">Update</button>
        </div>
        <button id="use-device-location" type="button">Use my location</button>
        <p class="privacy-note">Location is only used to get nearby weather.</p>
      </div>
      <div id="date-controls">
        <p id="date-controls-label">Choose a day</p>
        <div id="date-chip-row" role="group" aria-label="Choose a forecast day"></div>
      </div>
      <button id="controls-done" type="button">Done</button>
    </section>

    <main id="main-screen" hidden>
      <div id="character-card">
        <div id="character-stage">
          <img id="layer-base" class="character-layer" src="assets/character/character.png" alt="Character">
          <img id="layer-upper" class="character-layer" alt="">
          <img id="layer-lower" class="character-layer" alt="">
          <img id="layer-footwear" class="character-layer" alt="">
        </div>
      </div>

      <div id="weather-panel">
        <div id="weather-card">
          <div id="weather-icon-row">
            <img id="weather-icon-img" alt="">
            <div>
              <span id="temperature-display"></span>
              <p id="feels-like-display"></p>
            </div>
          </div>
          <p id="recommendation-text"></p>
        </div>

        <div id="reminders-card">
          <h2>Reminders</h2>
          <ul id="reminders-list"></ul>
        </div>
      </div>
    </main>

    <p id="status-message" role="status" class="status-pill"></p>
    <button id="retry-button" type="button" hidden>Try again</button>
  </div>
  <script type="module" src="js/main.js"></script>
</body>
</html>
