<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Weather Fit</title>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <div id="app">
    <h1>Weather Fit — location checkpoint</h1>
    <button id="use-device-location">Use my location</button>
    <form id="manual-location-form">
      <label for="manual-location-input">City or ZIP code</label>
      <input id="manual-location-input" type="text" placeholder="e.g. Austin, TX or 78701">
      <button type="submit">Set location</button>
    </form>
    <p id="location-status">No location set yet.</p>
    <p id="weather-status"></p>
  </div>
  <script type="module" src="js/main.js"></script>
</body>
</html>
